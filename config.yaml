# 企業リサーチシステム設定ファイル
#
# 実際に読んでいるのは ui.page_config だけ（main.py）。
# データ取得の設定は tools/fetch_financials.py に持たせている。

app:
  title: "企業リサーチシステム"
  version: "2.0.0"
  description: "上場企業の財務データを取得・検証して可視化する"

ui:
  # ページ設定
  page_config:
    page_title: "企業リサーチシステム"
    page_icon: "📊"
    layout: "wide"
    initial_sidebar_state: "expanded"
  
  # カラーテーマ
  colors:
    primary: "#1f77b4"
    secondary: "#ff7f0e"
    success: "#2ca02c"
    warning: "#d62728"
    info: "#17becf"
  
  # チャート設定
  charts:
    default_height: 400
    color_palette: ["#1f77b4", "#ff7f0e", "#2ca02c", "#d62728", "#9467bd"]
